[package]
name = "forge-ocr"
version = "0.1.0"
edition = "2024"
description = "Fast OCR for scanned documents: PP-OCR models on ONNX Runtime with a native Rust pipeline"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/znoowmk/forge-ocr"
keywords = ["ocr", "pdf", "onnx", "text-recognition"]
categories = ["computer-vision", "command-line-utilities"]

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "cuda", "tensorrt", "directml", "openvino", "rocm", "migraphx", "coreml", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "bmp", "webp", "pnm"] }
lopdf = "0.47"
rayon = "1.10"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
